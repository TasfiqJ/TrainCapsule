schemaVersion: "3.1"
enabled: true
remote: origin
baseBranch: main
visibility: public
repository: TasfiqJ/TrainCapsule
releaseMode: AUTOMATED_PR_REQUIRED_CHECKS_MACHINE_RECEIPT_AUTO_MERGE
directMainPush: false
candidateBranchPrefix: factory/
pullRequestMetadataPath: factory/state/latest-pull-request.json
exactHeadShaChecksRequired: true
independentMachinePolicyReceiptRequired: true
mergeQueueOrAutoMergeRequired: true
exactMergedMainVerificationRequired: true
publisherCapability: PENDING_PHASE_4
retry_attempts: 5
retry_backoff_seconds: 30
verify_remote_sha: true
remote_ci:
  enabled: true
  requiredWorkflows:
  - TrainCapsule / Factory quality
  - TrainCapsule / Product unit
  - TrainCapsule / Product contract
  - TrainCapsule / Security
  - TrainCapsule / Source-of-truth integrity
  - TrainCapsule / Packaging install
  - TrainCapsule / Docs and schemas
  - TrainCapsule / Source freshness
  required_risk_tiers:
  - integration
  - trust_core
  timeout_seconds: 1800
  poll_seconds: 20
  fail_closed: true
commit_subject_max_chars: 50
