crash_resume_delay_seconds: 120
autopilot_lock_path: factory/state/autopilot.lock
completion_dir: factory/completion
definition_of_done_path: factory/product_definition_of_done.yaml
risk_profiles_path: config/risk_profiles.yaml
context_config_path: config/context.yaml
context_index_path: docs/CONTEXT_INDEX.yaml
github_config_path: config/github.yaml
github_state_path: factory/state/github-sync.json
provenance_path: factory/state/provenance.jsonl
require_long_lived_oauth_for_autopilot: true
completion_audit_enabled: true
completion_audit_model: opus
completion_audit_max_turns: 100
completion_audit_budget_usd: 1000.0
remote_ci_poll_seconds: 20
remote_ci_timeout_seconds: 1800
task_catalog_path: factory/task_catalog.yaml
claude_features_path: config/claude_features.yaml
value_policy_path: config/value_policy.yaml
peer_message_dir: factory/messages
event_log_path: factory/logs/events.jsonl
