  - lines of code
  - raw test count without boundary coverage
  - GitHub stars without recurring use
  - model-written praise
  - synthetic customer quotes
  - unverified willingness-to-pay claims
  - fabricated benchmark results
  - post-hoc threshold lowering
  - component completion without a usable supported workflow
  - documentation or screenshots without runtime behavior evidence
  - synthetic activity represented as adoption, retention, or willingness to pay
  required_evidence_classes:
