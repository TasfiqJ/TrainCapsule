schemaVersion: "3.1"
generationId: traincapsule-v3.1-zh-2026-08-12
allowPaidUsage: false
repository:
  baseBranch: main
  releaseMode: AUTOMATED_PR_REQUIRED_CHECKS_MACHINE_RECEIPT_AUTO_MERGE
  directMainPush: false
  candidateBranchPrefix: factory/
  requireCleanBase: true
  candidateManifestRequired: true
execution:
  backend: claude
  maxConcurrentMutatingSessions: 1
  maxConcurrentReadOnlySessions: 1
  workUntilDone: false
  checkpointEveryStage: true
  preserveCandidateOnFailure: true
sourceOfTruth:
  activeGeneration: config/active_generation.yaml
  activeBundle: docs/source-of-truth/v3.1-zh-2026-08-12
  manifest: docs/source-of-truth/v3.1-zh-2026-08-12/FINAL_MANIFEST_V3_1_ZH.json
  contextIndex: docs/CONTEXT_INDEX.yaml
  integrityGate: source-of-truth-integrity
roadmap:
  milestones: factory/roadmap/milestones.yaml
  workItems: factory/roadmap/work_items.yaml
  dispositions: factory/roadmap/dispositions.yaml
  legacyMap: factory/roadmap/migrations/v2_to_v3.yaml
  completionMode: milestone
  expansionMode: proposal_only
runtime:
  localStateRootEnvironmentVariable: TCF_RUNTIME_ROOT
  singleInstanceLock: true
  hardStuckFile: HARD_STUCK.json
  stopFile: STOP
  migrationCompleteMarker: MIGRATION_COMPLETE_V3.json
  supervisorStateFile: supervisor-state.json
  supervisorLockFile: supervisor.lock
  redactSecrets: true
  rawCustomerEvidenceInRepository: false
release:
  directMainPushForbidden: true
  automatedPullRequestRequired: true
  exactHeadShaChecksRequired: true
  independentMachinePolicyReceiptRequired: true
  mergeQueueOrAutoMergeRequired: true
  exactMergedMainVerificationRequired: true
  publisherCapability: AUTOMATED_PR_V31_READY
operatorPolicy:
  zeroHumanOperation: true
  policyGateMode: deterministic_machine_policy
  activeAuthorityManifest: docs/source-of-truth/v3.1-zh-2026-08-12/FINAL_MANIFEST_V3_1_ZH.json
  externalTruthRemainsReceiptBound: true
  syntheticCommercialEvidenceForbidden: true
compatibility:
  inputVersion: 3
  disposition: READ_ONLY_LOSSLESS_ADAPTER
  allowedInputs:
  - config/autonomy.yaml
  - config/scheduler.yaml
  - config/executors.yaml
  - config/external_evidence.yaml
  - config/commercial_maturity.yaml
  - config/milestones.yaml
  - config/context.yaml
  rejectUndeclaredInputs: true
