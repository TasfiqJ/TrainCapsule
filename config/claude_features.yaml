version: 2
cross_session_messaging:
  enabled: true
  minimum_cli_version: 2.1.224
  risk_tiers:
  - integration
  - trust_core
  roles:
  - builder
  - research
  - recovery
  - integration_scout
  max_messages_per_session: 8
  max_message_chars: 2000
  same_machine_only: true
  isolate_peer_machines: true
  require_durable_handoff: true
advisor:
  enabled: false
  model: opus
  risk_tiers:
  - integration
  - trust_core
  roles:
  - builder
  - recovery
integration_scout:
  enabled: false
  risk_tiers:
  - integration
  - trust_core
  role: integration_scout
  timeout_seconds: 900
  startup_delay_seconds: 0.75
  blocking_on_concrete_failure: true
  blocking_on_non_pass: false
goal:
  enabled: true
  minimum_cli_version: 2.1.224
  risk_tiers:
  - standard
  - integration
  - trust_core
  roles:
  - planner
  - research
  - builder
  - recovery
  - factory_repair
  max_condition_chars: 1800
  max_turn_clause: 100
  note: Goal mode keeps a renewable production session working; deterministic controller gates remain release authority.
dynamic_workflows:
  enabled: false
  minimum_cli_version: 2.1.202
  size_guideline: medium
  roles:
  - research
  - builder
  - recovery
  risk_tiers:
  - integration
  - trust_core
  task_allowlist: []
  max_agents_guideline: 6
  non_authoritative: true
  reason: The normal Claude Code Agent tool is enabled for production roles; the separate Workflow tool remains off until the SDK exposes it reliably.
agent_teams:
  enabled: true
  reason: Mutating production roles may delegate bounded parallel investigation while the primary session owns the result.
memory:
  auto_memory_enabled: true
  durable_handoffs_only: true
role_skills:
  planner:
  - plan-bounded-task
  specification:
  - specify-contract
  builder:
  - implement-task
  integration_scout:
  - integration-proof
  adversary:
  - adversarial-review
  audit:
  - integration-proof
  security:
  - security-proof
  performance:
  - performance-proof
  release:
  - release-proof
  research:
  - source-audit
  recovery:
  - recover-task
  value_validator:
  - value-audit
  value_adversary:
  - value-audit
