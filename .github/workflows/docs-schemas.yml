name: TrainCapsule / Docs and schemas

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-schemas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-schemas:
    name: TrainCapsule / Docs and schemas
    runs-on: ${{ fromJSON(vars.TRAINCAPSULE_CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Install product workspace packages
        run: uv pip install --python .venv/bin/python -e packages/traincapsule-core -e packages/traincapsule-ingest-pytorch -e packages/traincapsule-qualify -e packages/traincapsule-cli
      - name: Verify generated schemas and documentation contracts
        run: |
          uv run python scripts/generate_v3_schemas.py --check
          uv run python scripts/generate_product_schemas.py --check
          uv run pytest tests/test_v3_config_and_roadmap.py tests/product/test_product_schemas.py
