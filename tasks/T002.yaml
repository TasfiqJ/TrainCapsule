  - independently_reproducible_in_supported_environment
  - no_documentation_only_or_mock_only_substitution
  falsification_criteria:
  - The capability is not required by a protected workflow or duplicates native tooling
    without additional decision value.
  - The result depends on fabricated, unattributed, or model-only evidence.
  - The component passes in isolation but the target user cannot complete the declared
    job end to end.
  - Installation, operation, failure diagnosis, recovery, or upgrade requires undocumented
    developer intervention.
  - A CONFLICT or UNKNOWN finding exists but the overall verdict is recorded as clear.
  revenue_linkage: Protects the ability to commercially ship under the chosen name/package/domain;
    supports incident closure, change qualification, private evidence exchange, or
    recurring reliability operations.
