[project]
name = "traincapsule-cli"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8",
  "typer>=0.12",
  "traincapsule-core==0.1.0",
  "traincapsule-ingest-pytorch==0.1.0",
  "traincapsule-qualify==0.1.0",
]

[project.scripts]
traincapsule = "traincapsule_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traincapsule_cli"]
