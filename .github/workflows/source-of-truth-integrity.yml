name: TrainCapsule / Source-of-truth integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-of-truth-integrity:
    runs-on: ${{ fromJSON(vars.TRAINCAPSULE_CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Verify authoritative source scope
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-artifacts
          uv run python scripts/gates/source_of_truth_integrity.py 2>&1 | tee .ci-artifacts/source-integrity.log
          uv run python scripts/generate_v3_roadmap.py --check 2>&1 | tee .ci-artifacts/roadmap-generation.log
          uv run python scripts/generate_v3_legacy_migration.py --check 2>&1 | tee .ci-artifacts/legacy-migration.log
          uv run pytest tests/test_source_of_truth_integrity.py 2>&1 | tee .ci-artifacts/source-tests.log
      - name: Retain source integrity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-integrity-${{ github.run_id }}
          path: .ci-artifacts/
          if-no-files-found: error
          retention-days: 30
