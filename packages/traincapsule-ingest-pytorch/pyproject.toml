[project]
name = "traincapsule-ingest-pytorch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8", "traincapsule-core==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traincapsule_ingest_pytorch"]
