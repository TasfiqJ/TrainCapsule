version: 3
enabled: true
remote: origin
baseBranch: main
branch: main
visibility: private
repository: TasfiqJ/TrainCapsule
releaseMode: owner_directed_main_only
directMainPush: true
releaseMetadataPath: factory/state/latest-release.json
push_after_verified_tasks: 2
push_interval_seconds: 900
push_before_quota_pause: true
push_at_completion: true
immediate_risk_tiers:
- integration
- trust_core
retry_attempts: 5
retry_backoff_seconds: 30
verify_remote_sha: true
remote_ci:
  enabled: true
  requiredWorkflows:
  - TrainCapsule / Factory quality
  - TrainCapsule / Product unit
  - TrainCapsule / Product contract
  - TrainCapsule / Security
  - TrainCapsule / Source-of-truth integrity
  - TrainCapsule / Packaging install
  - TrainCapsule / Docs and schemas
  - TrainCapsule / Source freshness
  required_risk_tiers:
  - integration
  - trust_core
  timeout_seconds: 1800
  poll_seconds: 20
  fail_closed: true
commit_subject_max_chars: 50
