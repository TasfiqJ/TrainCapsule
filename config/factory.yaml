global_prompt: prompts/global.md
monthly_budget_usd: 100.0
require_clean_main: true
sandbox_enabled: true
execution_mode: claude_led_nodes
work_until_done: true
disable_subscription_task_budget: true
disable_max_oauth_budget_caps: true
unsandbox_mutating_roles: true
mutating_session_turn_floor: 200
review_session_turn_floor: 80
project_settings_only: false
strict_mcp: false
max_parallel: 1
private_gate_runner_env: TCF_PRIVATE_GATE_RUNNER
pipeline_state_dir: factory/state/pipelines
feature_ledger_path: factory/feature_ledger.yaml
autonomy_config_path: config/autonomy.yaml
autonomy_state_path: factory/state/autonomy.json
quota_fallback_wait_seconds: 3600
transient_retry_seconds: 3600
