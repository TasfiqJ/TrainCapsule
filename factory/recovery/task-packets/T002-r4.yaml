task_id: T002
title: Recheck product name, package, domain, and trademark surface
phase: P0
goal: 'Produce an independently reviewable research record confirming whether the
  product name "TrainCapsule", its package identifier, and candidate domains are free
  of blocking trademark, package-registry, and domain-availability conflicts, or documenting
  the exact conflicts found.

  '
source_of_truth:
- docs/TrainCapsule_Matrix_Definitive_Master_Plan_v1.0.md
- docs/MASTER_PLAN_INDEX.md
- docs/PLANNER_LOOP.md
- factory/feature_ledger.yaml
depends_on:
- T001
inputs:
- 'Roadmap ID: T002'
- 'Required dependencies: T001'
- 'Lead role: Research'
- 'Phase: P0'
non_goals:
- Renaming the product or changing any source-of-truth naming decision
- Registering a domain, package name, or trademark
- Making a legal determination; only surfacing evidence for human/legal review
acceptance_criteria:
- A research record exists at docs/research/T002_name_trademark_check.md.
- The record states the exact product name and package identifiers under review, quoted
  from source-of-truth.
- The record documents trademark search results for the product name in at least one
  primary trademark register, with source URLs and query dates.
- The record documents package-name availability/collision status on every package
  registry the product actually intends to publish to (per source-of-truth), with
  source URLs and query dates.
- The record documents domain-availability status for each candidate domain named
  in source-of-truth, with source URLs and query dates.
- Every finding is labeled CLEAR, CONFLICT, or UNKNOWN; UNKNOWN is used whenever a
  check could not be completed and is never silently upgraded to CLEAR.
- Any CONFLICT finding includes the conflicting party/registrant, evidence link, and
  a plain description of the collision.
- The record includes an explicit overall verdict field (clear / conflicts_found /
  unknown) computed only from the itemized findings above.
- The record cites every source it used, and cites no source outside the allowed network
  domains.
- No file outside outputs is created or modified by the research stage.
- The adversary stage independently re-checks at least one CLEAR finding and confirms
  or disputes it with its own evidence link.
- The audit stage verifies every finding cites a working evidence link and that no
  CONFLICT or UNKNOWN was silently converted to CLEAR.
- The release stage only reads the record and machine gate output; it does not add
  new findings.
outputs:
- docs/research/T002_name_trademark_check.md
stop_conditions:
- Source-of-truth does not name a definitive product name, package identifier, or
  candidate domain list to check.
- No network access is available to any primary trademark, package-registry, or domain-registrar
  source, making the check unverifiable.
