[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "traincapsule-independent-verifier"
version = "3.1.0"
description = "Independent V3.1-ZH machine-policy verifier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46",
  "pydantic>=2.8",
]

[project.scripts]
traincapsule-verifier = "traincapsule_verifier.cli:main"
traincapsule-verifier-verify-receipt = "traincapsule_verifier.public_cli:main"
traincapsule-verifier-plan-install = "traincapsule_verifier.install_cli:main"
traincapsule-verifier-broker = "traincapsule_verifier.broker_cli:main"
traincapsule-verifier-request-broker = "traincapsule_verifier.request_broker_cli:main"
traincapsule-verifier-issuer = "traincapsule_verifier.issuer_service:main"
traincapsule-verifier-activation-issuer = "traincapsule_verifier.activation_issuer_service:main"
traincapsule-verifier-check-worker = "traincapsule_verifier.check_worker_cli:main"
traincapsule-verifier-observed-main-selector = "traincapsule_verifier.observed_main_selector:main"
traincapsule-verifier-activation-selector-broker = "traincapsule_verifier.activation_selector_broker:main"
traincapsule-verifier-ruleset-observer = "traincapsule_verifier.ruleset_observer:main"
traincapsule-verifier-ruleset-broker = "traincapsule_verifier.ruleset_broker:main"
traincapsule-verifier-canary-receipt-probe = "traincapsule_verifier.canary_receipt_probe:main"
traincapsule-verifier-controller-start = "traincapsule_verifier.controller_start_broker:main"
traincapsule-verifier-post-activation = "traincapsule_verifier.post_activation_observer:main"
traincapsule-verifier-activation-request-broker = "traincapsule_verifier.activation_request_broker:main"
traincapsule-verifier-git-anchor-producer = "traincapsule_verifier.git_anchor_producer:main"
traincapsule-verifier-git-anchor-updater = "traincapsule_verifier.git_anchor_updater:main"
traincapsule-anchor-askpass = "traincapsule_verifier.git_anchor_producer:askpass"

[tool.hatch.build.targets.wheel]
packages = ["src/traincapsule_verifier"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "traincapsule_verifier/schemas"
"tests/canonical-vector.json" = "traincapsule_verifier/canonical-vector.json"
