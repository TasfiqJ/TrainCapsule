name: TrainCapsule / Product contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-contract:
    runs-on: ${{ fromJSON(vars.TRAINCAPSULE_CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Install product workspace packages
        run: uv pip install --python .venv/bin/python -e packages/traincapsule-core -e packages/traincapsule-ingest-pytorch -e packages/traincapsule-qualify -e packages/traincapsule-cli
      - name: Run product contract and journey scope
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-artifacts
          uv run pytest \
            tests/product/test_flight_recorder_importer.py \
            tests/product/test_cli.py \
            tests/product/test_product_schemas.py \
            tests/product/test_qualification.py \
            tests/product/test_install_to_preflight_journey.py \
            2>&1 | tee .ci-artifacts/product-contract.log
      - name: Retain product contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-contract-${{ github.run_id }}
          path: .ci-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
