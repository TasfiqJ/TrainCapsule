version: 3
milestones:
  - milestoneId: M0_FACTORY_MIGRATED
    type: TRUST
    status: ACTIVE
    entryCriteria:
      - current controller paused
      - baseline and state snapshot recorded
    exitCriteria:
      - V3 source authority installed and integrity-checked
      - old bundle archived, not silently edited
      - lane/work-item/milestone schemas active
      - finite retry and restart budgets enforced
      - human and external evidence states implemented
      - completion expansion is proposal-only
      - release uses pull requests
      - factory and product CI separated
      - current queue safely migrated
      - one mechanical and one standard simulated work item complete
      - rollback tested
      - human approval of source migration recorded
    requiredEvidence:
      - migration manifest
      - test matrix
      - queue migration hashes
      - scheduler simulation artifacts
      - rollback rehearsal transcript
      - signed source-migration approval
    forbiddenClaims:
      - product complete
      - commercially validated
      - customer approved
    humanApprovalRequired: true
    humanApprovalRefs: []
  - milestoneId: M1_NATIVE_PREFLIGHT
    type: ENGINEERING
    status: PROPOSED
    entryCriteria:
      - M0_FACTORY_MIGRATED completed
    exitCriteria:
      - product packages exist separately from tcfactory
      - product schemas exist
      - Flight Recorder importer works on controlled and real-format fixtures
      - identity/evidence lock works
      - native baseline and evidence-completeness report work
      - eligibility engine returns every bounded terminal state
      - local CLI completes install-to-preflight journey
      - 30 named accounts, 15 detailed conversations, 5 incident timelines, 3 upcoming changes, 2 credible pilot candidates, and 1 lawfully accessed real archive are evidenced
      - current competitor matrix and reproducible native baseline identify the remaining decision gap
      - threat model, canonical identity oracle, parser adversarial tests, data/AI boundary, and reviewer plan exist
    requiredEvidence:
      - controlled product fixtures
      - trusted external discovery receipts
      - current primary-source competitor register
      - lawful incident-archive access receipt
    forbiddenClaims:
      - real incident reproduced
      - paid demand
      - native advantage demonstrated
    humanApprovalRequired: false
    humanApprovalRefs: []
  - milestoneId: M2_CONTROLLED_QUALIFICATION
    type: ENGINEERING
    status: PROPOSED
    entryCriteria:
      - M1_NATIVE_PREFLIGHT completed
    exitCriteria:
      - one controlled failure goes from native evidence to bounded qualification
      - one candidate fixes or guards the contract
      - one candidate regresses or remains failing
      - at least one legal reduction is verified
      - at least one illegal reduction is rejected
      - Recovery Assurance evaluates named properties
      - contract is locally verifiable, expiring, and requalifiable
      - result viewer is thin and read-only
      - real 2–8 GPU execution occurs
      - independent operator runs the journey
      - qualified human approves only controlled external demonstration, not commercial support
    requiredEvidence:
      - controlled baseline and candidate cases
      - legal and illegal reduction evidence
      - real GPU execution receipt
      - independent operator receipt
      - signed controlled-demonstration approval
    forbiddenClaims:
      - commercially validated
      - customer approved
      - universal safety
    humanApprovalRequired: true
    humanApprovalRefs: []
  - milestoneId: M3_PAID_PREFLIGHT
    type: COMMERCIAL
    status: WAITING_EXTERNAL
    entryCriteria:
      - M2_CONTROLLED_QUALIFICATION completed
    exitCriteria:
      - real evidence can be imported locally under policy
      - one customer-specific decision is in supported envelope
      - paid preflight packet, contract, security package, and pricing hypothesis are ready
      - adviser and reviewer availability confirmed
      - no customer or payment claim is made yet
    requiredEvidence:
      - trusted incident archive access receipt
      - current security and privacy review
      - exact paid-preflight offer identity
    forbiddenClaims:
      - customer demand proven
      - payment received
      - commercially supported
    humanApprovalRequired: true
    humanApprovalRefs: []
  - milestoneId: M4_PAID_PILOT
    type: COMMERCIAL
    status: WAITING_EXTERNAL
    entryCriteria:
      - paid contract or invoice/payment evidence
      - named incident and upcoming change
      - named decision owner and deadline
      - baseline and candidate access
      - local execution authority
      - privacy and security approval
      - second execution included
    exitCriteria:
      - real decision changed or materially strengthened
      - complete substitute did not produce the same bounded result at acceptable cost
      - customer confirms value exceeds price and retained effort
      - reusable contract installed
      - second action scheduled
    requiredEvidence:
      - trusted paid pilot receipt
      - customer decision and value receipt
      - case-specific human claim approval
    forbiddenClaims:
      - universal safety
      - guaranteed root cause
    humanApprovalRequired: true
    humanApprovalRefs: []
  - milestoneId: M5_PAID_REPEAT
    type: COMMERCIAL
    status: WAITING_EXTERNAL
    entryCriteria:
      - M4_PAID_PILOT completed
    exitCriteria:
      - same customer pays for or contractually consumes a second qualification
      - no trust-core rewrite
      - setup and delivery effort decline
      - contract drift and expiry work
      - another qualified operator participates
      - margin trajectory is improving
    requiredEvidence:
      - trusted second paid action receipt
      - independent operator receipt
      - delivery economics record
    forbiddenClaims:
      - commercially supported pack
      - repeatability beyond observed cases
    humanApprovalRequired: false
    humanApprovalRefs: []
  - milestoneId: M6_COMMERCIALLY_SUPPORTED_PACK
    type: COMMERCIAL
    status: WAITING_EXTERNAL
    entryCriteria:
      - M5_PAID_REPEAT completed
    exitCriteria:
      - at least one external-value demonstration
      - paid repeat
      - third same-family case or equivalent reusable proof
      - no trust-core rewrite
      - qualified human pack approval
      - security, support, and rollback are verified
      - native advantage remains current
      - commercially supportable scope and version policy exist
    requiredEvidence:
      - external value receipt
      - second paid action receipt
      - third same-family case evidence
      - current native substitute benchmark
      - signed commercial-pack approval
    forbiddenClaims:
      - universal safety
      - guaranteed root cause
      - support outside the approved scope
    humanApprovalRequired: true
    humanApprovalRefs: []
