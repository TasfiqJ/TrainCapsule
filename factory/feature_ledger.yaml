version: 2
source_of_truth: docs/source-of-truth/final-2026-08-09/12_ROADMAP_BACKLOG_AND_MASTER_BUILD_PROMPT.md#12.9-prioritized-task-ledger
rules:
  unfinished_items_may_not_be_deleted: true
  status_values:
  - blocked
  - ready
  - packet_proposed
  - packet_approved
  - queued
  - running
  - paused
  - external_wait
  - passed
  - failed
  - respec_required
  - deferred
  auto_enqueue_requires:
  - packet_approved
  - all_dependencies_passed
  - private_gate_configured_when_required
  lights_out_auto_merge_requires:
  - CALIBRATION_PASSED marker
  - external private gate configured
  - fresh role-separated live demonstration
  - deterministic sabotage and negative controls
  - private GitHub remote and remote CI at the same SHA
  lights_out_completion: All automatable local roadmap tasks pass; external-validation
    tasks remain external_wait until attributable evidence exists.
  risk_tiers:
  - mechanical
  - standard
  - integration
  - trust_core
  risk_may_only_increase: true
  commit_policy: One bounded verified commit per passing task; never force push.
  model_policy: Sonnet for routine bounded work; Opus only for truth-critical research,
    adversarial, security, or recovery work.
  task_packet_policy: Use the protected roadmap and controller catalog; re-specify
    only after evidence-backed ambiguity or failure.
