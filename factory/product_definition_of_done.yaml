  "private_outcome_oracle_contract": {
    "execution": "Candidate proof scripts and required commands are never completion authority and never run on the controller host. A private-owned driver installs the exact wheel and invokes it in a networkless, read-only, capability-dropped container that cannot access the private verifier.",
    "hidden_inputs": [
      "TCF_HIDDEN_NONCE",
      "TCF_HIDDEN_INCIDENT_ID",
      "TCF_HIDDEN_WORKLOAD",
      "TCF_HIDDEN_EVIDENCE_DIR",
      "TCF_HIDDEN_POLICY",
      "TCF_HIDDEN_CHANGE",
      "TCF_HIDDEN_CONTRACT",
      "TCF_HIDDEN_ARTIFACT",
      "TCF_HIDDEN_CORRUPT_CHECKPOINT"
    ],
    "machine_interface": "Every protected CLI operation supports --json and emits one JSON result with an explicit truth_state. Stateful commands accept --state-dir and artifact-producing commands accept --output. Doctor binds workload_id and workload_sha256; lock binds the same source; ingest and downstream artifacts bind incident and hidden evidence; analyze names last_consistent and first_inconsistent boundaries; repeated analysis emits a stable result_digest.",
    "journey_protocol": "The private driver independently runs doctor, lock, ingest, analyze, experiment plan/run, reduce, corrupt-checkpoint recovery assessment, contract creation, valid and invalid qualification, customer export, integrity verification, tamper rejection, revocation, revoked-artifact rejection, backup/restore, checkpoint/rollback, repeatability, resource bounds, and pilot instrumentation. Recovery subcommands backup, restore, checkpoint, and rollback use --state-dir and --output. Exported pilot evidence records privacy-safe time_to_value, workflow_success, failure_reason, repeat_use, and support_correlation fields.",
    "false_green_control": "Private randomized inputs, exact file hashes, cross-step identity bindings, non-pass counterexamples, restored-state byte equality, repeat-result equality, a 30-second representative bound, and direct artifact inspection determine the verdict. Candidate status strings, manifests, and self-authored proof scripts cannot make completion pass."
  },
  "capability_evidence_required": [
    "Close loop captures, reduces, replays, localizes, and verifies a failure or recovery with explicit faithfulness limits.",
    "Qualify loop evaluates a controlled change against an applicable, unexpired contract and blocks false-green results.",
    "Exchange loop emits policy-controlled, attributable, integrity-protected evidence without leaking restricted data.",
    "PRE_COLLECTIVE_LIFECYCLE_CONTRACT_V1 passes declared controls and catches declared hidden faults.",
    "CHECKPOINT_RESUME_STATE_CONSISTENCY_V1 passes declared controls and catches declared hidden faults.",
    "Every result distinguishes PASS, FAIL, UNKNOWN, INVALID_ORACLE, INFRASTRUCTURE_ERROR, and EXTERNAL_VALIDATION_REQUIRED.",
    "Private gates, protected expectations, release authority, OAuth material, and customer evidence remain outside builder-visible paths.",
    "Pause, resume, quota wait, single-instance lock, crash recovery, and Windows-login recovery are proven.",
    "A new target user can install the supported release in a clean environment and reach first attributable value without undocumented developer intervention.",
    "The primary buyer and user journeys run end to end through real product boundaries, including non-happy-path diagnostics and recovery.",
    "Upgrade, rollback, backup, restore, health inspection, and support evidence are reproducible and version attributable.",
    "Representative performance and resource limits are measured against predeclared workloads without turning synthetic results into demand claims."
  ],
  "commercial_readiness_evidence_required": [
    "A concrete economic buyer, daily user, painful job, differentiated outcome, and credible revenue linkage are documented against the protected product strategy.",
    "Packaging and pricing are explicit testable hypotheses tied to delivered value, not invented willingness-to-pay evidence.",
    "The product records privacy-safe time-to-value, successful workflow completion, failure reasons, repeat use, and support burden for real pilots.",
    "A pilot and external-validation packet can be handed to a real user without exposing hidden gates, OAuth material, restricted evidence, or internal controller machinery.",
    "Customer usage, retention, payment, renewal, maintainer confirmation, and acquisition interest remain EXTERNAL_VALIDATION_REQUIRED until independently attributable evidence exists."
  ],
  "founder_brief_execution_required": [
    "Planning and completion audits synthesize the company_product_brief context rather than treating roadmap tasks as isolated engineering tickets.",
    "Routine product, architecture, UX, packaging, support, and operating decisions are made autonomously from the supplied corpus and recorded when material; ordinary ambiguity is not an operator blocker.",
    "The delivered surface connects the protected product strategy to onboarding, first value, repeat value, reliability, supportability, value measurement, pilot readiness, and a credible paid offer.",
    "Task boundaries, session boundaries, small diffs, token estimates, and acceptance-count conventions cannot remove work necessary for a complete sellable outcome.",
    "Automatic completion review may expand the roadmap until every automatable requirement is satisfied; expansion count is not a product-scope ceiling."
  ],
  "quality_floor": [
    "No critical user workflow is documentation-only, mock-only, screenshot-only, or dependent on manual source edits.",
    "Security, privacy, data lifecycle, failure recovery, compatibility, performance, accessibility, and operator support have explicit evidence or truthful non-pass states.",
    "A green unit suite alone cannot satisfy product completion; real boundaries and end-to-end behavior must be exercised.",
    "Known limitations are visible to users and operators and cannot be laundered into release claims."
  ],
  "completion_exclusions": [
    "Real customer incident access, adoption, renewal, payment, funding, or acquisition interest.",
    "Universal GPU, framework, scheduler, or cloud coverage claims.",
    "Provider-caused attribution without independently sufficient evidence.",
    "Any external fact represented by self-authored or synthetic evidence."
  ]
