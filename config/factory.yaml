version: 10
auth_mode: max_oauth_only
allow_paid_usage: false
repo_root: .
task_dir: tasks
artifact_dir: factory/artifacts
worktree_dir: factory/worktrees
ledger_path: factory/state/ledger.json
queue_dir: factory/queue
worker_poll_seconds: 30
