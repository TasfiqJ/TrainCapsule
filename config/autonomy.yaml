version: 1
enabled: true
auto_plan: true
auto_enqueue: true
auto_merge: true
auto_resume_quota: true
auto_recover_interrupted: true
auto_respec_failed_tasks: true
max_respecifications_per_task: 3
idle_poll_seconds: 60
quota_reset_buffer_seconds: 0
unknown_limit_retry_seconds: 3600
max_consecutive_factory_failures: 5
completion_target: product_build
stop_file: factory/state/STOP
pause_file: factory/state/PAUSE
calibration_marker: factory/state/CALIBRATION_PASSED
require_calibration: true
notification_command: null
external_blocker_sleep_seconds: 3600
auto_expand_roadmap: true
completion_audits_required: 2
max_completion_expansions: 5
github_sync_enabled: true
push_after_verified_tasks: 2
push_interval_seconds: 900
push_before_quota_pause: true
push_on_integration_or_trust_task: true
push_at_completion: true
