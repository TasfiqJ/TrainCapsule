name: AI factory quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, linux, x64, traincapsule]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - run: uv run python scripts/verify_yaml_unique.py .
      - run: uv run tcfactory schema --output schemas/task.generated.json
      - run: uv run tcfactory validate-task tasks/DEMO-001.yaml
      - run: uv run tcfactory validate-task tasks/T001.yaml
      - run: uv run tcfactory validate-task tasks/T002.yaml
      - run: uv run python scripts/gates/catalog_consistency.py
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: bash scripts/verify_no_secrets.sh
      - run: bash scripts/verify_factory_authority.sh
      - run: bash scripts/gates/no_paid_usage.sh
      - run: bash scripts/gates/self_repair_scope.sh
