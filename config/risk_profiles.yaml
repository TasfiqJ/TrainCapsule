version: 6
principles:
- Use the controller-owned task catalog before asking a model to plan.
- Run deterministic gates before any model reviewer.
- Sonnet writes almost all production code and tests.
- Haiku handles only mechanical, non-authoritative review or fallback planning.
- Opus is reserved for truth-critical specification, primary-source research, adversarial
  analysis, and security.
- Every role starts in a fresh session and receives paths, hashes, and bounded handoff
  data rather than prior transcripts.
- The controller may raise risk; no model may lower it.
- Review depth follows the cost of a false green, not repository size.
- Fable is reserved for trust-core implementation that benefits from a long autonomous
  session; it falls back to Opus and then Sonnet when its included Max allowance is unavailable.
- Model selection never substitutes for evidence; deterministic gates, independent review,
  private gates, remote CI, and the predeclared customer-value contract decide quality.
- Model teams and open-ended subagents are disabled in the default loop.
